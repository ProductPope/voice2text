# dictAItor – konfiguracja. Wszystko działa lokalnie.
# Każdą sekcję możesz pominąć – brakujące wartości biorą się z domyślnych.

[general]
language = "pl"
# "auto" dobiera do sprzętu: large-v3-turbo na karcie NVIDIA lub CPU z 8+ rdzeniami,
# w innym wypadku small. Ręcznie: tiny / base / small / medium / large-v3 / large-v3-turbo
model = "auto"
device = "auto"        # "cpu", "cuda" albo "auto"
compute_type = "auto"  # "int8" (CPU), "float16" (GPU) albo "auto"

[gate]
# Bezpieczne hasło. Dopóki go nie powiesz, NIC nie jest wysyłane.
# Wybierz coś, czego nie mówisz przypadkiem w treści.
send_phrase = "wyślij teraz"
cancel_phrase = "anuluj wszystko"
match_threshold = 0.8   # tolerancja na przekręcenia przez Whispera (0–1)
require_pause = true    # hasło liczy się tylko, gdy po nim zamilkniesz

[pauses]
# Startowe progi. Jeśli włączysz [review], dopasują się do Twojego tempa mówienia.
comma_gap = 0.7         # pauza ≥ tyle sekund może być przecinkiem
sentence_gap = 1.5      # pauza ≥ tyle sekund kończy zdanie
split_silence = 0.6     # cisza, po której fragment idzie do transkrypcji (nie do wysłania!)
learn = true

[commands]
# Komendy głosowe. Pusta wartość wyłącza domyślną komendę.
# "kropka" = "."
# "nowa linia" = "\n"
# "cofnij" = "@undo"          # usuwa fragment od ostatniej pauzy
# "wyczyść wszystko" = "@clear"
# "kropka" = ""               # wyłącz, jeśli często mówisz „kropka” w treści

[text]
# Słowa-wypełniacze do usunięcia
# fillers = ["yyy", "eee", "hmm"]
# Po tych słowach pauza to „zastanawianie się”, nigdy koniec zdania
# continuations = ["i", "a", "że", "w", "na", "bo", "który"]
keep_case = []

[rules]
# Twoje stałe zasady: co Whisper słyszy → co ma być napisane
replacements = { "ej pi aj" = "API", "kubernetis" = "Kubernetes" }
# Nazwy i żargon, które Whisper ma lepiej rozpoznawać
vocabulary = ["Kubernetes", "PostgreSQL"]

[output]
# clipboard | type (wpisuje w aktywne okno) | stdout | file | command
mode = "clipboard"
file = "~/dyktowanie.txt"
command = ""            # np. "wl-copy" albo "xclip -selection clipboard"

[review]
# Po haśle otwiera $EDITOR z tekstem. Twoje poprawki są wysyłane
# i jednocześnie uczą narzędzie (zamiany słów + progi pauz).
enabled = false

[intent]
# „Rozumienie intencji” przez model językowy, np. „w poniedziałek… nie, we wtorek” → „we wtorek”.
# off = wyłączone | local = model na tym komputerze (Ollama, LM Studio) | claude = chmura (opcja)
mode = "off"
instructions = "Pisz zwięźle. Nie używaj wykrzykników."   # Twoje zasady stylu
local_url = "http://localhost:11434"
local_model = "qwen2.5:7b"
claude_model = "claude-opus-5-5"   # szybciej i taniej: "claude-haiku-4-5"
timeout = 8.0                      # po tylu sekundach wysyłany jest tekst bez poprawek AI
examples = 6                       # ile Twoich ostatnich poprawek pokazać modelowi
allow_remote = false               # zabezpieczenie: tryb local odmawia adresów spoza tego komputera
# Klucz API Claude NIE jest zapisywany tutaj – dodaj go w Ustawieniach aplikacji
# (trafia do Menedżera poświadczeń Windows) albo w zmiennej ANTHROPIC_API_KEY.

[profiles]
# Fragment tytułu okna → dodatkowe zasady stylu dla tej aplikacji
# "Slack" = "Luźno, bez kropki na końcu ostatniego zdania."
# "Outlook" = "Formalnie, pełne zdania."

[learning]
min_occurrences = 2     # ile razy poprawić to samo, żeby reguła się włączyła
min_pause_samples = 12

[app]
# Aplikacja w zasobniku (dictaitor app / 6-aplikacja.bat)
hotkey = "ctrl+alt+d"       # start/stop dyktowania
abort_seconds = 0.8         # czas na rozmyślenie się po haśle (Esc anuluje); 0 = od razu
delivery = "auto"           # auto | type (wpisuj) | paste (wklejaj) | clipboard (tylko schowek)
paste_over_chars = 300      # dłuższe teksty są wklejane zamiast wpisywane

[audio]
vad = "auto"            # silero (dokładny) | energy (prosty próg głośności) | auto
energy_threshold = 0.0  # tylko dla vad = "energy"; 0 = automatyczna kalibracja
max_chunk_seconds = 25.0
preview_interval = 1.0  # co ile sekund podgląd tego, co właśnie mówisz; 0 = wyłączony
