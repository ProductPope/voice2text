name: tests

# Automatic runs only while the repository is public (Actions minutes are free
# there). In a private repository the job is skipped and costs nothing; a manual
# run (Actions tab -> tests -> Run workflow) always works.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
