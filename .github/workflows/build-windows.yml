name: build-windows

# Builds the Windows installer on version tags (attached to a GitHub Release) and
# when the app or packaging changes. Automatic runs happen only while the repository
# is public (Actions minutes are free there); in a private repository the job is
# skipped and costs nothing. A manual run (Actions tab -> Run workflow) always works.
on:
  push:
    branches: ["**"]  # branch pushes build only when these paths change
    tags: ["v*"]      # path filters are not applied to tag pushes
    paths:
      - "packaging/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write  # attach the installer to a release

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[app]" pyinstaller
      - name: Freeze
        run: pyinstaller packaging/dictaitor.spec --noconfirm --distpath dist --workpath build
      - name: Smoke test the frozen command line
        shell: pwsh
        run: |
          $out = & dist\dictAItor\dictaitor-cli.exe simulate --output stdout "Test paczki [1.0] wyślij teraz"
          $out
          if (-not ($out -match "Test paczki\.")) { throw "frozen CLI did not produce the expected text" }
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (python -c "import dictaitor; print(dictaitor.__version__)")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: dictaitor-setup
          path: dist/dictaitor-setup-*.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dictaitor-setup-*.exe
          prerelease: ${{ contains(github.ref, 'b') }}
