[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dictaitor"
version = "0.9.0b1"
description = "Local dictation that understands your pauses and only sends after your safe phrase."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.optional-dependencies]
listen = ["faster-whisper>=1.0", "sounddevice", "pyperclip"]
type = ["pynput"]
app = ["faster-whisper>=1.0", "sounddevice", "pyperclip", "PySide6>=6.6", "anthropic>=1.0", "keyring"]
claude = ["anthropic>=1.0", "keyring"]
dev = ["pytest"]

[project.scripts]
dictaitor = "dictaitor.cli:main"

[project.gui-scripts]
dictaitor-app = "dictaitor.app.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dictaitor = ["config.example.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
