[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dictaitor"
version = "1.0.0"
description = "Local dictation that understands your pauses and only sends after your safe phrase."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Polish",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://github.com/ProductPope/voice2text"
Changelog = "https://github.com/ProductPope/voice2text/blob/main/CHANGELOG.md"

[project.optional-dependencies]
listen = ["faster-whisper>=1.0", "sounddevice", "pyperclip"]
type = ["pynput"]
app = ["faster-whisper>=1.0", "sounddevice", "pyperclip", "PySide6>=6.6", "anthropic>=1.0", "keyring"]
claude = ["anthropic>=1.0", "keyring"]
dev = ["pytest", "ruff"]

[project.scripts]
dictaitor = "dictaitor.cli:main"

[project.gui-scripts]
dictaitor-app = "dictaitor.app.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dictaitor = ["config.example.toml", "app/icon.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
